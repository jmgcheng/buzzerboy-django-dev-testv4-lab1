{% extends "base.html" %}

{% block content %}
        <div class="row">
          <div class="col-md-12">
            <div class="card">
              <div class="card-header">
                <h5 class="card-title">{{task.name}} - [<a href="{% url 'project-detail' project.id %}">{{project.title}}</a>]</h5>
                <!-- <p class="card-category">
                  Category <span class="text-info">{{project.category.name}}</span>. Status <span class="text-info">{{project.status}}</span>
                </p> -->
                <hr>
              </div>
              <div class="card-body">
                <div class="row">
                  <div class="col-md-12">
                    <div class="card card-plain">
                      <!-- <div class="card-header">
                        <h5 class="card-title">Notifications Style</h5>
                      </div> -->
                      <div class="card-body">
                        <p>
                          <b>Priority:</b> {{task.priority}}
                          <br>
                          <b>Due Date:</b> {{task.due_date}}
                          <br>
                          <b>Status:</b> {{task.status}}
                        </p>
                        <p>
                          <a href="{% url 'project-task-update' project.id task.id %}" class="btn">
                            Edit
                          </a>
                          <button class="btn btn-danger"
                                  data-toggle="delete-modal"
                                  data-url="{% url 'project-task-delete' project.pk task.pk %}"
                                  data-item="task '{{ task.title }}'">
                            Delete
                          </button>
                        </p>
                      </div>
                    </div>
                  </div>

                  
                </div>
              </div>
            </div>
          </div>
        </div>
        
        
{% endblock %}
