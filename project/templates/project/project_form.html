{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}

        <div class="row">
          <div class="col-md-12">
            <div class="card">
              <div class="card-header">
                <h5 class="card-title">{{form_action}} Project</h5>
                <hr>
              </div>
              <div class="card-body">
                <div class="row">
                  <div class="col-md-12">
                    <div class="card card-plain">
                      <!-- <div class="card-header">
                        <h5 class="card-title">Notifications Style</h5>
                      </div> -->
                      <div class="card-body">
                        
                        <form method="POST">
                          {% csrf_token %}
                          {{ form | crispy }}
                          <button class="btn btn-primary" type="submit">{{form_action}}</button>
                        </form>

                      </div>
                    </div>
                  </div>

                </div>
              </div>
            </div>
          </div>
        </div>
        
{% endblock %}
