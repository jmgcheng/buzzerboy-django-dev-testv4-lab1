{% extends "base.html" %}

{% block content %}
        <div class="row">
          <div class="col-md-12">
            <div class="card">
              <div class="card-header">
                <h5 class="card-title">{{menu.name}} - [<a href="{% url 'restaurant-detail' restaurant.id %}">{{restaurant.name}}</a>]</h5>
                <!-- <p class="card-category">
                  Category <span class="text-info">{{restaurant.category}}</span>. Status <span class="text-info">{{restaurant.status}}</span>
                </p> -->
                <hr>
              </div>
              <div class="card-body">
                <div class="row">
                  <div class="col-md-12">
                    <div class="card card-plain">
                      <!-- <div class="card-header">
                        <h5 class="card-title">Notifications Style</h5>
                      </div> -->
                      <div class="card-body">
                        <p>
                          <b>Menu Type:</b> {{menu.menu_type}}
                          <br>
                          <b>Price:</b> {{menu.price}}
                        </p>
                        <p>
                          <a href="{% url 'restaurant-menu-update' restaurant.id menu.id %}" class="btn">
                            Edit
                          </a>
                          <button class="btn btn-danger"
                                  data-toggle="delete-modal"
                                  data-url="{% url 'restaurant-menu-delete' restaurant.pk menu.pk %}"
                                  data-item="menu '{{ menu.name }}'">
                            Delete
                          </button>
                        </p>
                      </div>
                    </div>
                  </div>

                  
                </div>
              </div>
            </div>
          </div>
        </div>
        
        
{% endblock %}
